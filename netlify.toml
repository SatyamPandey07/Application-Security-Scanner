[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/auth/*"
  to = "http://34.45.59.50:8000/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scans/*"
  to = "http://34.45.59.50:8000/scans/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/findings/*"
  to = "http://34.45.59.50:8000/findings/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "http://34.45.59.50:8000/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
